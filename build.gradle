import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'application'
    id 'org.javamodularity.moduleplugin' version '2.0.1'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.10'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'de.dargmuesli'
version = '0.3.0'

repositories {
    mavenCentral()
}

ext {
    googleApiYouTubeVersion = 'v3-rev20260820-2.0.0'
    ikonliVersion = '12.4.0'
    junitVersion = '6.1.3'
    koinVersion = '4.2.0'
    kotlinCoroutineVersion = '1.11.0'
    kotlinSerializationVersion = '1.11.0'
    log4jVersion = '2.26.1'
    mp3agicVersion = '0.9.1'
    spotifyWebApiJavaVersion = '9.4.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17

    modularity.inferModulePath = false // https://github.com/openjfx/javafx-gradle-plugin/pull/154/files
}

application {
    mainModule = 'de.dargmuesli.spotilist'
    mainClass = 'de.dargmuesli.spotilist.MainApp'
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

javafx {
    version = '21.0.8'
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    implementation "com.google.apis:google-api-services-youtube:$googleApiYouTubeVersion"
    implementation "com.mpatric:mp3agic:$mp3agicVersion"
    implementation "io.insert-koin:koin-core:$koinVersion"
    implementation "org.apache.logging.log4j:log4j-api:$log4jVersion"
    implementation "org.apache.logging.log4j:log4j-core:$log4jVersion"
    implementation "org.apache.logging.log4j:log4j-slf4j2-impl:$log4jVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-javafx:$kotlinCoroutineVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlinSerializationVersion"
    implementation "org.kordamp.ikonli:ikonli-fontawesome5-pack:$ikonliVersion"
    implementation "org.kordamp.ikonli:ikonli-javafx:$ikonliVersion"
    implementation "se.michaelthelin.spotify:spotify-web-api-java:$spotifyWebApiJavaVersion"

    testImplementation "io.insert-koin:koin-test:$koinVersion"
    testImplementation "io.insert-koin:koin-test-junit5:$koinVersion"
    testImplementation "org.junit.jupiter:junit-jupiter-api:$junitVersion"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junitVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// koin-test transitively pulls in koin-core-annotations(-jvm), which the JPMS module resolver rejects as a split package with koin-core-jvm.
// The annotation processor isn't used here, so it's safe to drop.
configurations.all {
    exclude group: 'io.insert-koin', module: 'koin-core-annotations'
    exclude group: 'io.insert-koin', module: 'koin-core-annotations-jvm'
}

test {
    useJUnitPlatform()
}

/* https://stackoverflow.com/a/50119235/4682621 ***********************************************************************/
def generatedVersionDir = "${layout.buildDirectory.asFile.get()}/resources/main"

sourceSets {
    main {
        output.dir(generatedVersionDir, builtBy: 'generateVersionProperties')
    }
}

tasks.register('generateVersionProperties') {
    doLast {
        def propertiesFile = file "$generatedVersionDir/version.properties"
        propertiesFile.parentFile.mkdirs()
        def properties = new Properties()
        properties.setProperty("version", rootProject.version.toString())
        propertiesFile.withWriter { properties.store(it, null) }
    }
}
processResources.dependsOn generateVersionProperties
/**********************************************************************************************************************/